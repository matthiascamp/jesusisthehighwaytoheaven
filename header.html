<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<header class="main-header">
  <div class="hero">

    <div class="hero-slideshow">
      <div class="hero-slide" style="background-image:url('HeaderBanner1.jpg')"></div>
      <div class="hero-slide" style="background-image:url('HeaderBanner2.jpg')"></div>
      <div class="hero-slide active" style="background-image:url('HeaderBanner3.jpg')"></div>
      <div class="hero-slide" style="background-image:url('HeaderBanner4.jpg')"></div>
    </div>

    <div class="hero-overlay"></div>

    <div class="hero-content">
      <span class="hero-cross">✝</span>
      <h1>Jesus Christ is the Highway to Heaven!</h1>
      <p class="hero-subtitle">"I am the way, the truth, and the life." — John 14:6</p>

      <nav>
        <ul class="banner-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="introduction.html">Introduction</a></li>
          <li><a href="abide.html">Abide in Me</a></li>
          <li><a href="truth.html">Truth</a></li>
          <li><a href="forward.html">Forward</a></li>
          <li><a href="dontbeafraid.html">Don't Be Afraid</a></li>
          <li><a href="testimony.html">Testimony</a></li>
          <li><a href="contents.html">Contents</a></li>
        </ul>
      </nav>
    </div>

  </div>
</header>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
}

/* ── HERO ── */
.hero {
  position: relative;
  width: 100vw;
  height: 42vh;
  min-height: 270px;
  overflow: hidden;
}

.hero-slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 2s ease;
}
.hero-slide.active { opacity: 1; }

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(13, 27, 62, 0.80) 0%,
    rgba(13, 27, 62, 0.52) 55%,
    rgba(13, 27, 62, 0.72) 100%
  );
  z-index: 1;
}

/* ── CONTENT ── */
.hero-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #fff;
  padding: 1.5rem 2rem;
}

.hero-cross {
  font-size: 1.8rem;
  color: #c9a84c;
  text-shadow: 0 2px 14px rgba(201, 168, 76, 0.65);
  margin-bottom: 0.25rem;
  line-height: 1;
}

.hero-content h1 {
  font-family: 'Cinzel', 'Georgia', serif;
  font-weight: 700;
  margin: 0 0 0.35rem 0;
  font-size: clamp(1.5rem, 4vw, 3.2rem);
  color: #ffffff;
  letter-spacing: 0.04em;
  text-shadow: 0 4px 24px rgba(0,0,0,0.85), 0 0 50px rgba(201,168,76,0.20);
}

.hero-subtitle {
  font-family: 'Crimson Text', 'Georgia', serif;
  font-style: italic;
  font-size: clamp(0.88rem, 2vw, 1.18rem);
  color: #f0d98c;
  margin: 0 0 0.9rem 0;
  letter-spacing: 0.03em;
  text-shadow: 0 2px 10px rgba(0,0,0,0.55);
}

/* ── NAV ── */
.banner-menu {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.45rem 0.65rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.banner-menu li a {
  font-family: 'Cinzel', serif;
  font-size: clamp(0.62rem, 1.25vw, 0.82rem);
  font-weight: 600;
  letter-spacing: 0.06em;
  color: rgba(255,255,255,0.92);
  text-decoration: none;
  padding: 0.38rem 0.9rem;
  border: 1px solid rgba(201, 168, 76, 0.30);
  border-radius: 2rem;
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(4px);
  transition: all 0.28s ease;
  white-space: nowrap;
}

.banner-menu li a:hover {
  color: #f0d98c;
  background: rgba(201, 168, 76, 0.18);
  border-color: rgba(201, 168, 76, 0.70);
  box-shadow: 0 0 18px rgba(201, 168, 76, 0.22);
  transform: translateY(-1px);
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .hero {
    height: auto;
    min-height: 250px;
    padding-bottom: 1.2rem;
  }
  .hero-content h1 { font-size: clamp(1.25rem, 5.5vw, 2rem); }
  .hero-subtitle    { font-size: 0.88rem; }
  .banner-menu li a { font-size: 0.7rem; padding: 0.35rem 0.7rem; }
}

@media (max-width: 480px) {
  .hero { min-height: 230px; }
  .hero-cross { font-size: 1.4rem; }
  .hero-content h1  { font-size: 1.25rem; }
  .hero-subtitle    { font-size: 0.78rem; }
  .banner-menu      { gap: 0.35rem 0.45rem; }
  .banner-menu li a { font-size: 0.63rem; padding: 0.3rem 0.6rem; }
}
</style>

<script>
const slides = document.querySelectorAll('.hero-slide');
let i = 0;
setInterval(()=>{
  slides.forEach(s=>s.classList.remove('active'));
  i=(i+1)%slides.length;
  slides[i].classList.add('active');
},6000);
</script>
